name: Native ownership

on:
  pull_request:

permissions:
  contents: read

jobs:
  native-ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actual-source ownership regression and immutable baseline
        run: python3 .github/tests/run_native_ownership.py --verify-baseline
      - name: Existing source lifecycle tests
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
